<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunny's Projects</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e5e5e5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.container { max-width: 600px; width: 90%; padding: 40px; }
h1 { font-size: 28px; margin-bottom: 8px; background: linear-gradient(135deg, #0070f3, #7928ca); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.subtitle { color: #888; margin-bottom: 32px; font-size: 14px; }
.project { display: block; background: #141414; border: 1px solid #262626; border-radius: 12px; padding: 20px 24px; margin-bottom: 16px; text-decoration: none; color: inherit; transition: border-color 0.2s, transform 0.2s; }
.project:hover { border-color: #0070f3; transform: translateY(-2px); }
.project-name { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
.project-desc { font-size: 13px; color: #888; }
.arrow { float: right; color: #555; font-size: 20px; line-height: 40px; }
</style>
</head>
<body>
<div class="container">
  <h1>Sunny's Projects</h1>
  <p class="subtitle">Select a project to view</p>
  <a class="project" href="/payhub/">
    <span class="project-name">PayHub</span>
    <p class="project-desc">支付资源导航网站</p>
    <span class="arrow">&rarr;</span>
  </a>
  <a class="project" href="/san-sheng-liu-bu/">
    <span class="project-name">San Sheng Liu Bu</span>
    <p class="project-desc">三生六步项目</p>
    <span class="arrow">&rarr;</span>
  </a>
  <a class="project" href="/xianyu-manager/">
    <span class="project-name">Xianyu Manager</span>
    <p class="project-desc">闲鱼自动管理系统</p>
    <span class="arrow">&rarr;</span>
  </a>
</div>
</body>
</html>
